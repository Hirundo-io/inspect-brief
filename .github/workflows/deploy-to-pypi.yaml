name: Publish package to PyPI

on:
  pull_request:
    types: [closed]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build_and_verify:
    name: Build and verify distributions
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      ((contains(github.event.pull_request.labels.*.name, 'release') &&
      !contains(github.event.pull_request.labels.*.name, 'test')) ||
      (contains(github.event.pull_request.labels.*.name, 'test') &&
      !contains(github.event.pull_request.labels.*.name, 'release')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_digest: ${{ steps.distributions.outputs.artifact_digest }}
      package_version: ${{ steps.package.outputs.version }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout merged release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      - name: Audit resolved dependencies
        run: uv audit --frozen --preview-features audit-command
      - name: Read and validate package version
        id: package
        run: |
          package_version="$(uv version --short --no-sync)"
          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "Invalid package version: $package_version"
            exit 1
          fi
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
      - name: Export the locked build constraints
        run: |
          uv export \
            --frozen \
            --only-group build \
            --no-emit-project \
            --output-file /tmp/build-constraints.txt
      - name: Build distributions
        run: uv build --build-constraints /tmp/build-constraints.txt --require-hashes
      - name: Test wheel installation and entry points
        # The `uv pip` compatibility interface is intentional here: unlike
        # `uv sync` or `uv run`, it enforces hashes from the exported lock data
        # while installing the already-built wheel without re-resolving it.
        run: |
          uv venv /tmp/inspect-brief-release-venv
          uv export \
            --frozen \
            --no-dev \
            --no-emit-project \
            --output-file /tmp/release-requirements.txt
          uv pip install \
            --python /tmp/inspect-brief-release-venv/bin/python \
            --require-hashes \
            --requirement /tmp/release-requirements.txt
          uv pip install \
            --python /tmp/inspect-brief-release-venv/bin/python \
            --no-deps \
            dist/*.whl
          cd /tmp
          /tmp/inspect-brief-release-venv/bin/python -c \
            'from importlib.metadata import entry_points; from inspect_brief.hooks import InspectBriefHooks; entry_point = next(item for item in entry_points(group="inspect_ai") if item.name == "inspect_brief"); assert entry_point.load().InspectBriefHooks is InspectBriefHooks'
          /tmp/inspect-brief-release-venv/bin/inspect-brief --help
      - name: Test source distribution installation and entry points
        # The `uv pip` compatibility interface is intentional here: this check
        # needs both hash-enforced constraints and `--no-build-isolation` while
        # installing the already-built source distribution.
        run: |
          uv venv /tmp/inspect-brief-sdist-venv
          uv pip install \
            --python /tmp/inspect-brief-sdist-venv/bin/python \
            --require-hashes \
            --requirement /tmp/build-constraints.txt
          uv pip install \
            --python /tmp/inspect-brief-sdist-venv/bin/python \
            --require-hashes \
            --requirement /tmp/release-requirements.txt
          uv pip install \
            --python /tmp/inspect-brief-sdist-venv/bin/python \
            --no-build-isolation \
            --no-deps \
            dist/*.tar.gz
          cd /tmp
          /tmp/inspect-brief-sdist-venv/bin/python -c \
            'from importlib.metadata import entry_points; from inspect_brief.hooks import InspectBriefHooks; entry_point = next(item for item in entry_points(group="inspect_ai") if item.name == "inspect_brief"); assert entry_point.load().InspectBriefHooks is InspectBriefHooks'
          /tmp/inspect-brief-sdist-venv/bin/inspect-brief --help
      - name: Package verified distributions
        id: distributions
        run: |
          tar -cf distributions.tar dist
          artifact_digest="$(sha256sum distributions.tar | cut -d ' ' -f 1)"
          echo "artifact_digest=$artifact_digest" >> "$GITHUB_OUTPUT"
      - name: Upload verified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distributions
          path: distributions.tar
          if-no-files-found: error

  publish:
    needs: build_and_verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Configure both environments with required maintainers, prevent self-review,
    # and restrict deployments to the default branch.
    environment:
      name: ${{ contains(github.event.pull_request.labels.*.name, 'release') && 'pypi' || 'testpypi' }}
      url: ${{ contains(github.event.pull_request.labels.*.name, 'release') && 'https://pypi.org/p/inspect-brief' || 'https://test.pypi.org/p/inspect-brief' }}
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: distributions
          path: artifact
      - name: Verify downloaded distributions
        env:
          EXPECTED_DIGEST: ${{ needs.build_and_verify.outputs.artifact_digest }}
        run: |
          if [[ ! "$EXPECTED_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Missing or invalid distribution digest."
            exit 1
          fi
          echo "$EXPECTED_DIGEST  artifact/distributions.tar" | sha256sum --check --strict
          tar -xf artifact/distributions.tar
      - name: Tag verified release commit
        if: ${{ contains(github.event.pull_request.labels.*.name, 'release') }}
        env:
          GIT_PUSH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.build_and_verify.outputs.package_version }}
        run: |
          git config user.name "GitHub Actions [release-bot]"
          git config user.email "github-actions@hirundo.io"
          if git rev-parse --verify --quiet "refs/tags/v${PACKAGE_VERSION}"; then
            if [[ "$(git rev-list -n 1 "v${PACKAGE_VERSION}")" != "$(git rev-parse HEAD)" ]]; then
              echo "Tag v${PACKAGE_VERSION} already points to a different commit."
              exit 1
            fi
          else
            git tag -a "v${PACKAGE_VERSION}" -m "Release v${PACKAGE_VERSION}"
            git config --local credential.helper \
              '!f() { echo "username=x-access-token"; echo "password=$GIT_PUSH_TOKEN"; }; f'
            git push origin "v${PACKAGE_VERSION}"
            git config --local --unset-all credential.helper
          fi
      - name: Publish package to TestPyPI
        if: ${{ contains(github.event.pull_request.labels.*.name, 'test') }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish package to PyPI
        if: ${{ contains(github.event.pull_request.labels.*.name, 'release') }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

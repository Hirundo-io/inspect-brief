name: Create release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (for example, 0.2.0 or 0.2.0b1)
        required: true
        type: string
      test:
        description: Publish this release to TestPyPI
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}
          # Credentials are persisted deliberately: this job pushes the release
          # branch. `RELEASE_TOKEN` is preferred because pushes and pull requests
          # made with the default `GITHUB_TOKEN` do not start workflow runs, so a
          # release PR opened with it shows no checks and cannot satisfy required
          # status checks.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"
      - name: Validate version and create release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
          PR_ASSIGNEE: ${{ github.event.sender.login || github.actor }}
          RELEASE_LABEL: ${{ inputs.test && 'test' || 'release' }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "Version must be a concrete PEP 440 release such as 0.2.0 or 0.2.0b1."
            exit 1
          fi

          if [[ "$HAS_RELEASE_TOKEN" == "true" ]]; then
            pr_note="CI runs automatically on this pull request."
          else
            pr_note="RELEASE_TOKEN is not configured, so this pull request was opened with the default GITHUB_TOKEN and no workflow runs were started. Dispatch the CI workflows manually against this branch before merging."
            echo "::warning::RELEASE_TOKEN is not configured; CI will not start automatically on the release PR."
          fi

          uv sync --locked --group dev
          git config user.name "GitHub Actions [release-bot]"
          git config user.email "github-actions@hirundo.io"
          git switch -c "release-${RELEASE_VERSION}"
          uv run bumpver update --set-version "$RELEASE_VERSION"
          uv lock
          git add pyproject.toml inspect_brief/__init__.py uv.lock
          git commit -m "Bump version to ${RELEASE_VERSION}"
          git push -u origin "release-${RELEASE_VERSION}"
          gh pr create \
            --assignee "$PR_ASSIGNEE" \
            --title "v${RELEASE_VERSION}" \
            --body "Automated release PR for version ${RELEASE_VERSION}. ${pr_note}" \
            --label "$RELEASE_LABEL"

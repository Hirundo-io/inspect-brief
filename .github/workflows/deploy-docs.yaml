name: Deploy Sphinx docs to GitHub Pages

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  classify:
    name: Classify the release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Reads the tag name and `pyproject.toml` only. It installs nothing and runs
    # no project or dependency code, and it never holds the deploy credentials,
    # so an unapproved tag cannot reach the `github-pages` environment.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - name: Checkout packaging metadata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: pyproject.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Read version from the release tag
        id: release
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "Tag $TAG_NAME does not name a PEP 440 release."
            exit 1
          fi
          # Only final releases are published. `smv_tag_whitelist` matches finals
          # only, so a prerelease would generate no directory, and the published
          # root redirect must point at the latest stable version.
          if [[ "$version" =~ (a|b|rc)[0-9]+$ ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG_NAME is a prerelease; skipping documentation deployment."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          # Fail closed when the tag disagrees with the packaged version, so a
          # tag pointing at an unintended commit cannot publish as that release.
          declared="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)"
          if [[ "$declared" != "$version" ]]; then
            echo "Tag $TAG_NAME does not match the packaged version $declared."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  deploy-docs:
    name: Build and deploy documentation
    needs: classify
    if: needs.classify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      pages: write
    # Scoped to this job so a prerelease tag does not occupy the Pages group.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # `sphinx-multiversion` reads documentation from every release tag, so
          # the full history and all tags must be present.
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          # No cache: a tag-triggered publishing workflow must not consume a
          # cache that a pull request could have poisoned.
          enable-cache: false
      - name: Install documentation dependencies
        run: uv sync --locked --group docs
      - name: Build versioned documentation
        env:
          TZ: UTC
          PACKAGE_VERSION: ${{ needs.classify.outputs.version }}
        run: |
          uv run sphinx-multiversion docs docs/_build/html
          version_dir="docs/_build/html/v${PACKAGE_VERSION}"
          if [ ! -d "$version_dir" ]; then
            echo "Expected generated documentation at $version_dir"
            exit 1
          fi
          # Point the root at the highest stable release rather than this run's
          # version, so re-running an older tag cannot send the root backward.
          latest="$(git tag --list 'v*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -1)"
          latest="${latest#v}"
          if [ -z "$latest" ]; then
            echo "No stable release tag found."
            exit 1
          fi
          echo "::notice::Root redirect points at v${latest}."
          PACKAGE_VERSION="$latest"
          cat > docs/_build/html/index.html <<HTML
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <title>Redirecting to the latest release</title>
              <meta http-equiv="refresh" content="0; url=./v${PACKAGE_VERSION}/index.html" />
              <link rel="canonical" href="https://hirundo-io.github.io/inspect-brief/v${PACKAGE_VERSION}/index.html" />
            </head>
          </html>
          HTML
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/_build/html
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

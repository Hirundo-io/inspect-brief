name: Deploy Sphinx docs to GitHub Pages

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # `sphinx-multiversion` reads documentation from every release tag, so
          # the full history and all tags must be present.
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          # No cache: a tag-triggered publishing workflow must not consume a
          # cache that a pull request could have poisoned.
          enable-cache: false
      - name: Install documentation dependencies
        run: uv sync --locked --group docs
      - name: Read version from the release tag
        id: release
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "Tag $TAG_NAME does not name a PEP 440 release."
            exit 1
          fi
          # Only final releases are published. `smv_tag_whitelist` matches finals
          # only, so a prerelease would generate no directory, and the published
          # root redirect must point at the latest stable version.
          if [[ "$version" =~ (a|b|rc)[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG_NAME is a prerelease; skipping documentation deployment."
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Build versioned documentation
        if: steps.release.outputs.prerelease != 'true'
        env:
          TZ: UTC
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          uv run sphinx-multiversion docs docs/_build/html
          version_dir="docs/_build/html/v${PACKAGE_VERSION}"
          if [ ! -d "$version_dir" ]; then
            echo "Expected generated documentation at $version_dir"
            exit 1
          fi
          cat > docs/_build/html/index.html <<HTML
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <title>Redirecting to the latest release</title>
              <meta http-equiv="refresh" content="0; url=./v${PACKAGE_VERSION}/index.html" />
              <link rel="canonical" href="https://hirundo-io.github.io/inspect-brief/v${PACKAGE_VERSION}/index.html" />
            </head>
          </html>
          HTML
      - name: Configure Pages
        if: steps.release.outputs.prerelease != 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload Pages artifact
        if: steps.release.outputs.prerelease != 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/_build/html
      - name: Deploy to GitHub Pages
        if: steps.release.outputs.prerelease != 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

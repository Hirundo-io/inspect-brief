name: Package

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-install:
    name: Python ${{ matrix.python-version }} with minimum Inspect AI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
          python-version: ${{ matrix.python-version }}
      - name: Export the locked build constraints
        run: |
          uv export \
            --frozen \
            --only-group build \
            --no-emit-project \
            --output-file /tmp/build-constraints.txt
      - name: Build distributions
        run: uv build --build-constraints /tmp/build-constraints.txt --require-hashes
      - name: Read the declared Inspect AI requirement
        id: inspect
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          requirement="$(uv run --python "$PYTHON_VERSION" --no-project python -c 'import tomllib; data = tomllib.load(open("pyproject.toml", "rb")); print(next(item for item in data["project"]["dependencies"] if item.startswith("inspect-ai")))')"
          echo "requirement=$requirement" >> "$GITHUB_OUTPUT"
      - name: Verify installed entry points with the minimum Inspect AI version
        env:
          INSPECT_REQUIREMENT: ${{ steps.inspect.outputs.requirement }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        # Run outside the repository root so the installed distribution is imported
        # instead of the source tree.
        run: |
          wheel="$(realpath dist/*.whl)"
          cd /tmp
          uv run \
            --python "$PYTHON_VERSION" \
            --with "$wheel" \
            --with "$INSPECT_REQUIREMENT" \
            --resolution lowest-direct \
            --no-project \
            python -c \
            'from importlib.metadata import entry_points; from inspect_brief.hooks import InspectBriefHooks; entry_point = next(item for item in entry_points(group="inspect_ai") if item.name == "inspect_brief"); assert entry_point.load().InspectBriefHooks is InspectBriefHooks'
          uv run \
            --python "$PYTHON_VERSION" \
            --with "$wheel" \
            --with "$INSPECT_REQUIREMENT" \
            --resolution lowest-direct \
            --no-project \
            inspect-brief --help

name: Package

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
          python-version: "3.12"
          version: "0.12.8"
      - name: Build distributions
        run: uv build
      - name: Install with the minimum Inspect AI version
        run: |
          uv venv --python 3.12 /tmp/inspect-brief-package-venv
          uv pip install \
            --python /tmp/inspect-brief-package-venv/bin/python \
            "inspect-ai==0.3.112" \
            dist/*.whl
      - name: Verify installed entry points
        run: |
          /tmp/inspect-brief-package-venv/bin/python -c \
            'from importlib.metadata import entry_points; assert any(item.name == "inspect_brief" for item in entry_points(group="inspect_ai"))'
          /tmp/inspect-brief-package-venv/bin/inspect-brief --help
